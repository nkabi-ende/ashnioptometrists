name: Ashni Site Quality

on:
  push:
    branches:
      - main
      - enhancement/ashni-brand-local-seo-20261024
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build TanStack Start website
        run: bun run build
      - name: Verify Cloudflare branding assets and Worker target
        run: |
          test -f .output/public/ashni-logo-approved.svg
          test -f .output/public/ashni-logo-mark.svg
          test -f .output/public/favicon.svg
          test -f .output/public/og-ashni.png
          test -f .output/public/og-ashni-dr-v2.png
          grep -q '"name": "ashnioptometrists"' .output/server/wrangler.json
          npx --yes wrangler@4.152.0 deploy --dry-run --outdir /tmp/ashni-worker-dry-run
      - name: Run regression tests
        run: bun run test
