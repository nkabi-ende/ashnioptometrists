name: Ashni Site Quality

on:
  push:
    branches:
      - main
      - enhancement/ashni-brand-local-seo-20261024
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build TanStack Start website
        run: bun run build
      - name: Run regression tests
        run: bun run test
