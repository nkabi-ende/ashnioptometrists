name: Diagnose live Ashni logo delivery
on:
  push:
    branches: [fix/verify-logo-delivery-20261024]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Confirm files exist in Git and compiled assets
        run: |
          echo "-- SOURCE ASSETS --"
          ls -lh public/*logo* public/favicon* public/og-ashni* || true
          bun run build
          echo "-- OUTPUT ASSETS --"
          find .output/public -maxdepth 3 -type f | grep -E '(logo|favicon|og-ashni)' || true
          echo "-- OUTPUT DIRECTORIES --"
          ls -la .output/public .output/server || true
          echo "-- GENERATED CLOUDFLARE CONFIG --"
          cat .output/server/wrangler.json
          echo "-- NITRO DEPLOY CONFIG --"
          cat .wrangler/deploy/config.json || true
          echo "-- CHECK EXPECTED TARGET --"
          grep -q '"name": "ashnioptometrists"' .output/server/wrangler.json
          echo "-- WRANGLER DRY RUN --"
          npx --yes wrangler@4.152.0 deploy --dry-run --outdir /tmp/ashni-worker-dry-run
          echo "-- GIT HEAD --"
          git rev-parse HEAD
      - name: Probe live domain and assets
        run: |
          for path in / /ashni-logo-approved.svg /ashni-logo-mark.svg /favicon.svg /favicon.png /og-ashni.png /robots.txt /sitemap.xml; do
            echo "--- https://ashnioptometrists.com${path} ---"
            curl -L --silent --show-error --connect-timeout 8 --max-time 20 --output /tmp/ashni-response -w 'HTTP:%{http_code} TYPE:%{content_type} BYTES:%{size_download} REMOTE_IP:%{remote_ip} REDIRECT:%{url_effective}\n' "https://ashnioptometrists.com${path}" || true
            if [ "${path}" = "/" ]; then head -c 500 /tmp/ashni-response || true; echo; fi
          done
