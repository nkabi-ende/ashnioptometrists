name: Verify live Ashni production branding
on:
  push:
    branches: [diagnostics/after-cloudflare-fix-20261024]
jobs:
  live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check Cloudflare serves the newest main deployment
        shell: bash
        run: |
          set -euo pipefail
          base="https://ashnioptometrists.com"
          echo "Checking Cloudflare public release marker (main branch)"
          ready=0
          for attempt in $(seq 1 18); do
            status=$(curl -L --silent --show-error --connect-timeout 10 --max-time 18 --output /tmp/ashni-health --write-out '%{http_code}' "$base/deployment-health.json?probe=$attempt" || true)
            if [ "$status" = "200" ] && grep -q 'ashni-approved-logo-social-seo-2026-10-24-v2' /tmp/ashni-health; then
              echo "Latest main release marker LIVE on check $attempt"
              cat /tmp/ashni-health
              ready=1
              break
            fi
            echo "Check $attempt/18: status=$status; latest release not yet serving"
            sleep 10
          done
          if [ "$ready" -ne 1 ]; then
            echo "ERROR: Latest main release is not being served by Cloudflare."
            exit 1
          fi
      - name: Verify approved logos, favicon and social sharing image
        shell: bash
        run: |
          set -euo pipefail
          base="https://ashnioptometrists.com"
          for path in /ashni-logo-approved.svg /ashni-logo-mark.svg /favicon.svg /og-ashni.png /sitemap.xml /robots.txt; do
            status=$(curl --fail -L --silent --show-error --connect-timeout 10 --max-time 20 --output /tmp/ashni-asset --write-out '%{http_code} %{content_type} %{size_download}' "$base$path")
            echo "$path -> $status"
            test -s /tmp/ashni-asset
            if [[ "$path" == *.svg ]]; then
              grep -q '<svg' /tmp/ashni-asset
            fi
            if [[ "$path" == *.png ]]; then
              file --mime-type /tmp/ashni-asset | grep -q 'image/png'
            fi
          done
          curl --fail -L --silent --show-error "$base/" --output /tmp/ashni-home
          grep -q '/ashni-logo-mark.svg' /tmp/ashni-home
          grep -q '/ashni-logo-approved.svg' /tmp/ashni-home
          grep -q 'og-ashni.png' /tmp/ashni-home
          echo "PASS: Home HTML contains approved logos and social metadata"
